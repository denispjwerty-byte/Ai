name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Версия llama.cpp: ветка или тег. Позже замените master на конкретный тег (bNNNN),
  # чтобы сборка не ломалась от изменений в llama.cpp.
  LLAMA_CPP_REF: master
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ZIP из корня репозитория распаковывается прямо на роботе (в репозиторий ничего не коммитится).
      - name: Unpack ZIP from repo root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          for z in "${zips[@]}"; do
            echo "== Распаковываю $z =="
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp" -x '__MACOSX/*'

            # Если внутри архива одна общая папка, берём файлы из неё.
            count=$(find "$tmp" -mindepth 1 -maxdepth 1 | wc -l)
            src="$tmp"
            if [ "$count" -eq 1 ] && [ -d "$(find "$tmp" -mindepth 1 -maxdepth 1)" ]; then
              src="$(find "$tmp" -mindepth 1 -maxdepth 1)"
            fi

            # .github пропускаем (workflow уже на месте), остальное кладём в корень.
            rm -rf "$src/.github" "$src/__MACOSX"
            cp -a "$src"/. ./
          done

          if [ ! -f settings.gradle ]; then
            echo "::error::settings.gradle не найден. Загрузите ZIP с проектом в корень репозитория."
            ls -la
            exit 1
          fi

      # Если llama.cpp не добавлен как submodule, робот скачает его сам.
      - name: Fetch llama.cpp (if not a submodule)
        run: |
          if [ ! -f llama.cpp/CMakeLists.txt ]; then
            rm -rf llama.cpp
            git clone --depth 1 --branch "$LLAMA_CPP_REF" https://github.com/ggml-org/llama.cpp llama.cpp
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK, CMake, platform
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Gradle wrapper (gradlew) с телефона создать сложно, поэтому робот генерирует его сам.
      # Если вы позже добавите gradlew в репозиторий, этот шаг пропустится.
      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gguf-launcher-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
